<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 650">
<title id="title">Field timeline</title>
<desc id="desc">Research-area lanes with annual paper-count bubbles.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.title { font-size: 28px; font-weight: 650; fill: #202938; }
.subtitle { font-size: 14px; fill: #657287; }
.axis { font-size: 13px; fill: #657287; }
.label { font-size: 13px; fill: #202938; }
.small { font-size: 11px; fill: #657287; }
</style>
<rect width="1200" height="650" fill="#FFFFFF"/>
<text class="title" x="48" y="48">Field timeline</text>
<text class="subtitle" x="48" y="74">Bubble area represents the number of cataloged papers in each research area and year.</text>
<line x1="250.0" y1="110" x2="250.0" y2="536" stroke="#DCE3EC"/>
<text class="label" x="250.0" y="94" text-anchor="middle">2023</text>
<line x1="540.0" y1="110" x2="540.0" y2="536" stroke="#DCE3EC"/>
<text class="label" x="540.0" y="94" text-anchor="middle">2024</text>
<line x1="830.0" y1="110" x2="830.0" y2="536" stroke="#DCE3EC"/>
<text class="label" x="830.0" y="94" text-anchor="middle">2025</text>
<line x1="1120.0" y1="110" x2="1120.0" y2="536" stroke="#DCE3EC"/>
<text class="label" x="1120.0" y="94" text-anchor="middle">2026</text>
<text class="label" x="222" y="133" text-anchor="end">Surveys</text>
<line x1="250" y1="128" x2="1120" y2="128" stroke="#DCE3EC"/>
<circle cx="540.0" cy="128" r="11.1" fill="#667585" fill-opacity="0.88"><title>Surveys, 2024: 1 papers</title></circle>
<text x="540.0" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">1</text>
<circle cx="830.0" cy="128" r="21.4" fill="#667585" fill-opacity="0.88"><title>Surveys, 2025: 12 papers</title></circle>
<text x="830.0" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">12</text>
<circle cx="1120.0" cy="128" r="14.2" fill="#667585" fill-opacity="0.88"><title>Surveys, 2026: 3 papers</title></circle>
<text x="1120.0" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">3</text>
<text class="label" x="222" y="197" text-anchor="end">OOD Generalization</text>
<line x1="250" y1="192" x2="1120" y2="192" stroke="#DCE3EC"/>
<circle cx="830.0" cy="192" r="14.2" fill="#2F7D73" fill-opacity="0.88"><title>OOD Generalization, 2025: 3 papers</title></circle>
<text x="830.0" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">3</text>
<circle cx="1120.0" cy="192" r="17.2" fill="#2F7D73" fill-opacity="0.88"><title>OOD Generalization, 2026: 6 papers</title></circle>
<text x="1120.0" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">6</text>
<text class="label" x="222" y="261" text-anchor="end">Training Attacks</text>
<line x1="250" y1="256" x2="1120" y2="256" stroke="#DCE3EC"/>
<circle cx="830.0" cy="256" r="15.3" fill="#7356A3" fill-opacity="0.88"><title>Training Attacks, 2025: 4 papers</title></circle>
<text x="830.0" y="261" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">4</text>
<circle cx="1120.0" cy="256" r="14.2" fill="#7356A3" fill-opacity="0.88"><title>Training Attacks, 2026: 3 papers</title></circle>
<text x="1120.0" y="261" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">3</text>
<text class="label" x="222" y="325" text-anchor="end">Inference Attacks</text>
<line x1="250" y1="320" x2="1120" y2="320" stroke="#DCE3EC"/>
<circle cx="830.0" cy="320" r="21.4" fill="#B0523A" fill-opacity="0.88"><title>Inference Attacks, 2025: 12 papers</title></circle>
<text x="830.0" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">12</text>
<circle cx="1120.0" cy="320" r="15.3" fill="#B0523A" fill-opacity="0.88"><title>Inference Attacks, 2026: 4 papers</title></circle>
<text x="1120.0" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">4</text>
<text class="label" x="222" y="389" text-anchor="end">Defenses</text>
<line x1="250" y1="384" x2="1120" y2="384" stroke="#DCE3EC"/>
<circle cx="250.0" cy="384" r="15.3" fill="#4F67A5" fill-opacity="0.88"><title>Defenses, 2023: 4 papers</title></circle>
<text x="250.0" y="389" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">4</text>
<circle cx="540.0" cy="384" r="16.3" fill="#4F67A5" fill-opacity="0.88"><title>Defenses, 2024: 5 papers</title></circle>
<text x="540.0" y="389" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">5</text>
<circle cx="830.0" cy="384" r="26.0" fill="#4F67A5" fill-opacity="0.88"><title>Defenses, 2025: 21 papers</title></circle>
<text x="830.0" y="389" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">21</text>
<circle cx="1120.0" cy="384" r="23.6" fill="#4F67A5" fill-opacity="0.88"><title>Defenses, 2026: 16 papers</title></circle>
<text x="1120.0" y="389" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">16</text>
<text class="label" x="222" y="453" text-anchor="end">Benchmarks</text>
<line x1="250" y1="448" x2="1120" y2="448" stroke="#DCE3EC"/>
<circle cx="250.0" cy="448" r="11.1" fill="#C48724" fill-opacity="0.88"><title>Benchmarks, 2023: 1 papers</title></circle>
<text x="250.0" y="453" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">1</text>
<circle cx="540.0" cy="448" r="16.3" fill="#C48724" fill-opacity="0.88"><title>Benchmarks, 2024: 5 papers</title></circle>
<text x="540.0" y="453" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">5</text>
<circle cx="830.0" cy="448" r="21.4" fill="#C48724" fill-opacity="0.88"><title>Benchmarks, 2025: 12 papers</title></circle>
<text x="830.0" y="453" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">12</text>
<circle cx="1120.0" cy="448" r="20.1" fill="#C48724" fill-opacity="0.88"><title>Benchmarks, 2026: 10 papers</title></circle>
<text x="1120.0" y="453" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">10</text>
<text class="label" x="222" y="517" text-anchor="end">System Security</text>
<line x1="250" y1="512" x2="1120" y2="512" stroke="#DCE3EC"/>
<circle cx="830.0" cy="512" r="11.1" fill="#AE4560" fill-opacity="0.88"><title>System Security, 2025: 1 papers</title></circle>
<text x="830.0" y="517" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">1</text>
<circle cx="1120.0" cy="512" r="11.1" fill="#AE4560" fill-opacity="0.88"><title>System Security, 2026: 1 papers</title></circle>
<text x="1120.0" y="517" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">1</text>
<text class="small" x="250" y="616">No bubble means no paper in the current catalog for that area-year cell.</text>
</svg>
