<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awesome Physical AI Safety</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css"><style>body{max-width:1100px;margin:32px auto;padding:0 22px;background:#fff}.markdown-body{font-size:15px}</style></head><body><article id="content" class="markdown-body"></article><script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script><script>const source="# Awesome Physical AI Safety\n\n**\ud83e\udd16 An LLM-assisted bibliography of safety, security, robustness, ethical and societal risks, and trustworthy deployment across VLA, robots, autonomous systems, and embodied agents.**\n\n[![Awesome](https://awesome.re/badge.svg)](https://awesome.re)\n[![PRs Welcome](https://img.shields.io/badge/PRs-welcome-brightgreen.svg)](../CONTRIBUTING.md)\n[![Cite this repository](https://img.shields.io/badge/Cite-CITATION.cff-blue.svg)](../CITATION.cff)\n[![LLM-assisted](https://img.shields.io/badge/curation-%F0%9F%A4%96%20LLM--assisted-critical.svg)](../docs/daily-curation-workflow.md)\n[![Licenses: MIT + CC BY 4.0](https://img.shields.io/badge/Licenses-MIT%20%2B%20CC%20BY%204.0-3FA89B?style=flat)](../LICENSES.md) [![Papers](https://img.shields.io/badge/Papers-250-6F9FEF?style=flat)](../docs/index.html) [![Update](https://img.shields.io/badge/Update-Daily-D47A5D?style=flat)](../docs/daily-curation-workflow.md)\n\n**[\ud83d\udd0e Explore the interactive research landscape \u2192](../docs/index.html#heatmap)** \u2014 open any chart cell to inspect its contributing papers.\n\n## Author\n\n[**Futa Waseda**](https://futa-waseda.netlify.app/) \u2014 Project Assistant Professor, National Institute of Informatics (NII), Japan.\n\n## About This Catalog\n\n### \ud83d\udca1 Core Organizing Principle\n\n- **\ud83d\udccf Measured outcomes:** Risk labels record what a paper measures\u2014such as attack success, task success, collision rate, or constraint violations\u2014not harms it only discusses.\n- **\ud83e\udde9 Threat & failure mechanisms:** Each record traces lifecycle \u2192 mechanism \u2192 surface \u2192 target \u2192 consequence.\n- **\ud83d\udd0e Cross-map views:** Trace threat mechanisms to entry surfaces and measured outcomes, with the contributing papers one click away.\n- **\ud83d\udd04 Cross-system transfer:** The catalog connects VLA research with relevant robot, autonomous-system, embodied-agent, and LLM/VLM safety work.\n\n## \ud83d\udcda Citing\n\nCite this catalog for its bibliography, taxonomy, metadata, visualizations, or curation methodology; cite original papers for individual claims. See [CITATION.cff](../CITATION.cff).\n\n```bibtex\n@misc{waseda_awesome_physical_ai_safety,\n  author = {Waseda, Futa},\n  title  = {Awesome Physical AI Safety},\n  year   = {2026},\n  url    = {https://github.com/futakw/Awesome-Physical-AI-Safety}\n}\n```\n\n## \ud83d\udd0e Research Landscape\n\nThese metadata-based views reveal relationships within this catalog\u2014not field-wide prevalence or evidence that a defense works. Open a cell to check its source papers.\n\n[![Cataloged papers by research area and year](../assets/visualizations/field-timeline.svg)](../docs/index.html#timeline)\n\nWhere has this catalog grown over time? [Explore the timeline \u2192](../docs/index.html#timeline)\n\n[![Threat mechanisms by entry surface in this catalog](../assets/visualizations/threat-heatmap.svg)](../docs/index.html#heatmap)\n\nWhich threat mechanisms appear at which entry surfaces? [Explore the cross-map \u2192](../docs/index.html#heatmap)\n\n[![Threat mechanisms by empirically evaluated risk in this catalog](../assets/visualizations/threat-risk-heatmap.svg)](../docs/index.html#risk)\n\nWhich measured outcomes are reported for each mechanism? [Inspect the underlying papers \u2192](../docs/index.html#risk)\n\n## Taxonomy at a Glance\n\n### Risk outcomes\n\nA label is shown only when the paper reports a corresponding empirical outcome metric; discussion or potential impact alone does not qualify.\n\n- ![Task](https://img.shields.io/badge/-Task-6F9FEF?style=flat) task or route completion, success rate, or equivalent execution outcome.\n- ![Physical](https://img.shields.io/badge/-Physical-D96F8A?style=flat) collision, damage, unsafe motion or force, physical harm, or safety-constraint violation.\n- ![Ethics](https://img.shields.io/badge/-Ethics-9873D4?style=flat) harmful-instruction compliance or refusal, policy violations, or measured group disparities in embodied outcomes.\n- ![Security/Privacy](https://img.shields.io/badge/-Security%2FPrivacy-B88A24?style=flat) attack success, backdoor activation, control hijacking, unauthorized access, leakage, or compromise.\n- **\u2014:** no directly corresponding outcome is empirically evaluated, as is common for surveys and diagnostic-only work.\n\n### Failure sources\n\n- **Adversarial:** malicious manipulation of inputs, training, states, actions, or system components.\n- **Non-adversarial / OOD:** failures under unseen viewpoints, objects, language, tasks, environments, embodiments, or dynamics.\n- **Design / system:** misalignment, misspecified objectives, sensor faults, planner-executor mismatch, or failed recovery.\n\n### Threat model badges\n\nEach concrete threat model is rendered in two lines. A `+N` suffix indicates additional values retained in `data/papers.json`.\n\n![Lifecycle](https://img.shields.io/badge/-Lifecycle-6F9FEF?style=flat) ![Surface](https://img.shields.io/badge/-Surface-3FA89B?style=flat)<br>![Mechanism](https://img.shields.io/badge/-Mechanism-D47A5D?style=flat) &nbsp;\u2192&nbsp; ![Target](https://img.shields.io/badge/-Target-9873D4?style=flat) &nbsp;\u2192&nbsp; ![Consequence](https://img.shields.io/badge/-Consequence-D96F8A?style=flat)\n\nSee [the full taxonomy](../docs/taxonomy.md) for definitions and inclusion rules.\n\n## \ud83e\udded Contents\n\n- [\  - [Privacy-Preserving Perception](#defenses-privacy-preserving-perception)\n  - [Uncertainty, Abstention, and Human Oversight](#defenses-uncertainty-abstention-and-human-oversight)\n- **\ud83d\udcca Benchmarks and Evaluation**\n  - [OOD and Generalization Benchmarks](#benchmarks-ood-and-generalization-benchmarks)\n  - [Comprehensive VLA Evaluation](#benchmarks-comprehensive-vla-evaluation)\n  - [Adversarial and Physical Robustness](#benchmarks-adversarial-and-physical-robustness)\n  - [Task and Physical Safety](#benchmarks-task-and-physical-safety)\n  - [Semantic and Ethical Safety](#benchmarks-semantic-and-ethical-safety)\n  - [Evaluation Infrastructure](#benchmarks-evaluation-infrastructure)\n  - [Safety and Hazard Benchmarks](#benchmarks-safety-and-hazard-benchmarks)\n  - [Robustness and Uncertainty Evaluation](#benchmarks-robustness-and-uncertainty-evaluation)\n  - [Safety-Critical Perception Evaluation](#benchmarks-safety-critical-perception-evaluation)\n- **\ud83d\udd10 System-Level Security, Privacy, and Misuse**\n  - [Cross-Layer System Security](#system-security-cross-layer-system-security)\n  - [Privacy, Misuse, and Covert Channels](#system-security-privacy-misuse-and-covert-channels)\n\n</details>\n\n**250 papers in the current catalog.**\n\n<a id=\"surveys\"></a>\n\n## \ud83d\udcda Surveys and Perspectives\n\n<a id=\"surveys-embodied-ai-safety-and-security\"></a>\n\n### Embodied AI Safety and Security\n\n| Paper | Venue | Evaluated Risk | Threat Model |\n|---|---:|---|---|\n| **[Navigating Embodied Intelligence: Enabling Technologies, Security and Privacy, and Emerging Trends](https://doi.org/10.1109/JIOT.2025.3649049)**<br><sub>Wang et al.</sub> | IEEE IoT Journal 2026 | \u2014 | ![Cross-lifecycle](https://img.shields.io/badge/-Cross--lifecycle-6F9FEF?style=flat) ![Multiple surfaces](https://img.shields.io/badge/-Multiple_surfaces-3FA89B?style=flat) <br> ![Survey coverage](https://img.shields.io/badge/-Survey_coverage-657A8C?style=flat) |\n| **[Securit
